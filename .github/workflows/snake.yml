name: Generate Snake Game

on:
  schedule:
    # Executa a cada 12 horas
    - cron: "0 */12 * * *"  
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    # Permissão necessária para evitar o erro 128 no git push
    permissions:
      contents: write

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=pink&color_dots=#161b22,#3b1443,#6b217a,#9c32b2,#d946ef
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=pink&color_dots=#161b22,#3b1443,#6b217a,#9c32b2,#d946ef

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
